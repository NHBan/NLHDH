<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPU Scheduling Simulator</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="container py-4">
    <h2 class="text-center mb-4 text-primary fw-bold">🖥️ CPU Scheduling Simulator</h2>
    
    <div class="row">
      <!-- Cột nhập liệu -->
      <div class="col-md-4">
        <div class="card mb-3">
          <div class="card-header bg-dark text-white fw-bold">1. Thêm Tiến Trình</div>
          <div class="card-body">
            <form id="form-add-process">
              <div class="mb-3">
                <label class="form-label">Arrival Time (Thời điểm đến)</label>
                <input type="number" id="arrival-time" class="form-control" required min="0" value="0">
              </div>
              <div class="mb-3">
                <label class="form-label">Burst Time (Thời gian xử lý)</label>
                <input type="number" id="burst-time" class="form-control" required min="1">
              </div>
              <button type="submit" class="btn btn-primary w-100">Thêm vào hàng đợi</button>
            </form>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-header bg-dark text-white fw-bold">2. Cấu Hình & Chạy</div>
          <div class="card-body">
            <label class="form-label">Chọn thuật toán:</label>
            <select id="algo-select" class="form-select mb-3">
              <!-- JS sẽ tự động nạp thuật toán vào đây -->
            </select>
            <button id="btn-run" class="btn btn-success w-100 fw-bold">Mô Phỏng Ngay</button>
          </div>
        </div>
      </div>

      <!-- Cột hiển thị -->
      <div class="col-md-8">
        <div class="card mb-3">
          <div class="card-header bg-dark text-white fw-bold">Hàng Đợi Hiện Tại</div>
          <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0 text-center">
              <thead class="table-light">
                <tr>
                  <th>Tiến trình</th>
                  <th>Arrival Time</th>
                  <th>Burst Time</th>
                  <th>Hành động</th>
                </tr>
              </thead>
              <tbody id="process-table-body">
                <!-- JS render danh sách -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Vùng kết quả (Mặc định ẩn) -->
        <div id="result-section" class="d-none">
          <div class="card mb-3">
            <div class="card-header bg-primary text-white fw-bold">Biểu Đồ Gantt</div>
            <div class="card-body">
              <div id="gantt-chart"></div>
            </div>
          </div>

          <div class="card mb-3">
            <div class="card-header bg-success text-white fw-bold">Bảng Kết Quả</div>
            <div class="card-body p-0">
              <table class="table table-bordered mb-0 text-center">
                <thead class="table-light">
                  <tr>
                    <th>PID</th>
                    <th>AT</th>
                    <th>BT</th>
                    <th>Bắt đầu</th>
                    <th>Hoàn thành</th>
                    <th>Thời gian chờ</th>
                    <th>Turnaround</th>
                  </tr>
                </thead>
                <tbody id="result-table-body"></tbody>
              </table>
            </div>
            <div class="card-footer d-flex justify-content-around fw-bold text-danger">
              <span>Trung bình chờ (WT): <span id="avg-wt">0</span></span>
              <span>Trung bình lưu lại (TAT): <span id="avg-tat">0</span></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Type="module" cực kỳ quan trọng để chạy import/export -->
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
